[colors.primary]
background = "#192330"
bright_foreground = "#d6d6d7"
dim_foreground = "#aeafb0"
foreground = "#cdcecf"

[colors.search.focused_match]
background = "#81b29a"
foreground = "#cdcecf"

[colors.search.matches]
background = "#3c5372"
foreground = "#cdcecf"

[colors.selection]
background = "#2b3b51"
